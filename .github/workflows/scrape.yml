name: Scrape Keno

on:
  schedule:
    # safety net — restarts the loop if it ever breaks (best-effort, ~5 min min)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allow manual trigger

permissions:
  contents: write

# Only one run at a time — prevents the cron and the self-trigger loop from
# overlapping and causing git push conflicts.
concurrency:
  group: keno-scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape and build data
        env:
          TZ: America/New_York
        run: python build_data.py

      - name: Commit updated data
        run: |
          git config user.name "keno-bot"
          git config user.email "keno-bot@users.noreply.github.com"
          git add data/draws.csv data/draws.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "scrape: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Re-trigger in 2 minutes
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "PAT secret not set — falling back to 5-min cron only"
            exit 0
          fi
          sleep 120
          curl -s -X POST \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/thesahilsinh/ct-keno/actions/workflows/scrape.yml/dispatches \
            -d '{"ref":"main"}'
          echo "re-triggered"
